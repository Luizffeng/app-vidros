<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" fill="none" aria-labelledby="title">
  <title id="title">Porta Pivotante (aluminio)</title>
  <defs>
    <symbol id="fechadura" viewBox="0 0 18 40">
      <rect x="1" y="1" width="16" height="38" fill="currentColor"/>
      <circle cx="9" cy="11" r="4" fill="#fff"/>
      <circle cx="9" cy="28" r="2.2" fill="#fff"/>
      <path d="M9 30.2 L6.2 36 L11.8 36 Z" fill="#fff"/>
    </symbol>
    <pattern id="glass-incolor-stripes" patternUnits="userSpaceOnUse" width="84" height="56" patternTransform="rotate(32 42 28)">
      <rect width="84" height="56" fill="none"/>
      <g fill="#F0FAFE">
        <rect x="7" y="-12" width="4" height="80"/>
        <rect x="18" y="-12" width="18" height="80"/>
      </g>
    </pattern>
    <linearGradient id="glass-grad" gradientUnits="userSpaceOnUse" x1="106" y1="32" x2="214" y2="208">
      <stop offset="0%" stop-color="#C8EBFA"/>
      <stop offset="100%" stop-color="#A8D8F0"/>
    </linearGradient>
    <clipPath id="vidro-pane"><rect x="106" y="32" width="108" height="176"/></clipPath>
  </defs>
  <g clip-path="url(#vidro-pane)">
    <rect x="106" y="32" width="108" height="176" fill="url(#glass-grad)"/>
    <rect x="106" y="32" width="108" height="176" fill="url(#glass-incolor-stripes)"/>
  </g>
  <g stroke="#9AA0A6" stroke-width="2.5" stroke-linecap="square">
    <line x1="106" y1="32" x2="106" y2="208"/>
    <line x1="106" y1="32" x2="214" y2="32"/>
  </g>
  <g color="#9AA0A6">
    <rect x="106" y="32" width="18" height="8" fill="currentColor"/>
    <rect x="106" y="200" width="18" height="9.25" fill="currentColor"/>
    <rect x="194" y="200" width="10" height="9.25" fill="currentColor"/>
    <use href="#fechadura" x="202" y="106.4" width="12" height="27.2"/>
  </g>
