<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" fill="none" aria-labelledby="title">
  <title id="title">Porta Correr 1 Folha (aluminio)</title>
  <defs>
    <symbol id="fechadura" viewBox="0 0 18 40">
      <rect x="1" y="1" width="16" height="38" fill="currentColor"/>
      <circle cx="9" cy="11" r="4" fill="#fff"/>
      <circle cx="9" cy="28" r="2.2" fill="#fff"/>
      <path d="M9 30.2 L6.2 36 L11.8 36 Z" fill="#fff"/>
    </symbol>
    <pattern id="glass-incolor-stripes" patternUnits="userSpaceOnUse" width="84" height="56" patternTransform="rotate(32 42 28)">
      <rect width="84" height="56" fill="none"/>
      <g fill="#F0FAFE">
        <rect x="7" y="-12" width="4" height="80"/>
        <rect x="18" y="-12" width="18" height="80"/>
      </g>
    </pattern>
    <linearGradient id="glass-grad" gradientUnits="userSpaceOnUse" x1="62" y1="48" x2="182" y2="200">
      <stop offset="0%" stop-color="#C8EBFA"/>
      <stop offset="100%" stop-color="#A8D8F0"/>
    </linearGradient>
    <linearGradient id="parede-fade" gradientUnits="userSpaceOnUse" x1="188" y1="0" x2="268" y2="0">
      <stop offset="0%" stop-color="#E8ECF1"/>
      <stop offset="100%" stop-color="#F5F7FA" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="vidro"><rect x="62" y="48" width="120" height="152"/></clipPath>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#000"/>
    </marker>
  </defs>
  <rect x="188" y="48" width="80" height="152" fill="url(#parede-fade)"/>
  <text x="228" y="128" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9AA0A6" letter-spacing="2">PAREDE</text>
  <rect x="48" y="48" width="14" height="152" fill="#9AA0A6"/>
  <g clip-path="url(#vidro)">
    <rect x="62" y="48" width="120" height="152" fill="url(#glass-grad)"/>
    <rect x="62" y="48" width="120" height="152" fill="url(#glass-incolor-stripes)"/>
  </g>
  <g stroke="#9AA0A6" stroke-width="2.5" stroke-linecap="square">
    <line x1="48" y1="32" x2="268" y2="32"/>
    <line x1="48" y1="48" x2="48" y2="200"/>
    <line x1="182" y1="48" x2="182" y2="200"/>
    <line x1="182" y1="200" x2="268" y2="200"/>
  </g>
  <g stroke="#000" stroke-width="2.5" stroke-linecap="square">
    <line x1="188" y1="48" x2="188" y2="200" stroke-dasharray="6 4"/>
    <line x1="105" y1="120" x2="155" y2="120" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g color="#9AA0A6">
    <circle cx="118" cy="36" r="3.5" fill="currentColor"/>
    <circle cx="132" cy="36" r="3.5" fill="currentColor"/>
    <use href="#fechadura" x="170" y="110.4" width="12" height="27.2"/>
  </g>
</svg>
