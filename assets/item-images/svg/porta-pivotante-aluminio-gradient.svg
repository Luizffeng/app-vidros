<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" fill="none" aria-labelledby="title">
  <title id="title">Porta Pivotante (aluminio)  teste gradiente</title>
  <defs>
    <symbol id="fechadura" viewBox="0 0 18 40">
      <rect x="1" y="1" width="16" height="38" rx="3" fill="currentColor"/>
      <circle cx="9" cy="11" r="4" fill="#fff"/>
      <circle cx="9" cy="28" r="2.2" fill="#fff"/>
      <path d="M9 30.2 L6.2 36 L11.8 36 Z" fill="#fff"/>
    </symbol>

    <linearGradient id="glass-incolor-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="84" y2="56">
      <stop offset="0%" stop-color="#C8EBFA"/>
      <stop offset="100%" stop-color="#B5DFF5"/>
    </linearGradient>

    <pattern
      id="glass-incolor-tile-gradient"
      patternUnits="userSpaceOnUse"
      width="84"
      height="56"
      patternTransform="rotate(32 42 28)"
    >
      <rect width="84" height="56" fill="url(#glass-incolor-grad)"/>
      <g fill="#F0FAFE">
        <rect x="7" y="-12" width="4" height="80"/>
        <rect x="18" y="-12" width="18" height="80"/>
      </g>
    </pattern>

    <clipPath id="vidro-pane">
      <rect x="106" y="32" width="108" height="176"/>
    </clipPath>
  </defs>

  <g clip-path="url(#vidro-pane)">
    <rect x="106" y="32" width="108" height="176" fill="url(#glass-incolor-tile-gradient)"/>
  </g>

  <g stroke="#9AA0A6" stroke-width="2.5" stroke-linecap="square">
    <line x1="106" y1="32" x2="106" y2="208"/>
    <line x1="214" y1="32" x2="214" y2="208"/>
    <line x1="106" y1="32" x2="214" y2="32"/>
  </g>

  <g stroke="#000" stroke-width="2.5" stroke-linecap="square">
    <line x1="106" y1="208" x2="214" y2="208"/>
  </g>

  <g color="#9AA0A6">
    <rect x="106" y="32" width="18" height="8" fill="currentColor"/>
    <rect x="106" y="200" width="18" height="8" fill="currentColor"/>
    <rect x="194" y="200" width="10" height="8" fill="currentColor"/>
    <use href="#fechadura" x="199" y="103" width="15" height="34"/>
  </g>
</svg>
