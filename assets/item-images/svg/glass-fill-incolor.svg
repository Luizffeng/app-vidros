<svg xmlns="http://www.w3.org/2000/svg" width="216" height="176" viewBox="0 0 216 176" aria-labelledby="title">
  <title id="title">Vidro Incolor — padrao repetivel</title>
  <defs>
    <!--
      Faixas verticais no tile, rotacionadas ~32° (mesmo angulo BL→TR).
      Repete sem emendas de grade — copiar para <defs> dos diagramas.
      Uso: <rect fill="url(#glass-incolor-tile)"/> dentro de clipPath.
    -->
    <pattern
      id="glass-incolor-tile"
      patternUnits="userSpaceOnUse"
      width="84"
      height="56"
      patternTransform="rotate(32 42 28)"
    >
      <rect width="84" height="56" fill="#ADDBF3"/>
      <g fill="#F0FAFE">
        <rect x="7" y="-12" width="4" height="80"/>
        <rect x="18" y="-12" width="18" height="80"/>
      </g>
    </pattern>
  </defs>

  <rect width="216" height="176" fill="url(#glass-incolor-tile)"/>
</svg>
