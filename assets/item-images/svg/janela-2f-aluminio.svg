      <circle cx="9" cy="11" r="4" fill="#fff"/>
      <circle cx="9" cy="28" r="2.2" fill="#fff"/>
      <path d="M9 30.2 L6.2 36 L11.8 36 Z" fill="#fff"/>
    </symbol>
    <pattern id="glass-incolor-stripes" patternUnits="userSpaceOnUse" width="84" height="56" patternTransform="rotate(32 42 28)">
      <rect width="84" height="56" fill="none"/>
      <g fill="#F0FAFE"><rect x="7" y="-12" width="4" height="80"/><rect x="18" y="-12" width="18" height="80"/></g>
    </pattern>
    <linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="52" y1="48" x2="160" y2="200"><stop offset="0%" stop-color="#C8EBFA"/><stop offset="100%" stop-color="#A8D8F0"/></linearGradient>
    <linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="160" y1="48" x2="268" y2="200"><stop offset="0%" stop-color="#C8EBFA"/><stop offset="100%" stop-color="#A8D8F0"/></linearGradient>
    <clipPath id="p1"><rect x="52" y="48" width="108" height="152"/></clipPath>
    <clipPath id="p2"><rect x="160" y="48" width="108" height="152"/></clipPath>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#000"/></marker>
  </defs>
  <g clip-path="url(#p1)"><rect x="52" y="48" width="108" height="152" fill="url(#g1)"/><rect x="52" y="48" width="108" height="152" fill="url(#glass-incolor-stripes)"/></g>
  <g clip-path="url(#p2)"><rect x="160" y="48" width="108" height="152" fill="url(#g2)"/><rect x="160" y="48" width="108" height="152" fill="url(#glass-incolor-stripes)"/></g>
  <g stroke="#9AA0A6" stroke-width="2.5" stroke-linecap="square">
