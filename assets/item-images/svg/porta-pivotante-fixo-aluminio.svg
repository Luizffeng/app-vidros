<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" fill="none" aria-labelledby="title">
  <title id="title">Porta Pivotante + Fixo (aluminio)</title>
  <defs>
    <symbol id="fechadura" viewBox="0 0 18 40">
      <rect x="1" y="1" width="16" height="38" rx="3" fill="currentColor"/>
      <circle cx="9" cy="11" r="4" fill="#fff"/>
      <circle cx="9" cy="28" r="2.2" fill="#fff"/>
      <path d="M9 30.2 L6.2 36 L11.8 36 Z" fill="#fff"/>
    </symbol>
  </defs>

  <!-- Vidro esquerdo -->
  <rect x="48" y="32" width="108" height="176" fill="#fff"/>
  <!-- Vidro direito -->
  <rect x="156" y="32" width="104" height="176" fill="#fff"/>

  <!-- Aluminio: laterais externas, topo e base (exceto base do vidro esquerdo) -->
  <g stroke="#9AA0A6" stroke-width="2.5" stroke-linecap="square">
    <!-- Vidro esquerdo: esquerda e topo -->
    <line x1="48" y1="32" x2="48" y2="208"/>
    <line x1="48" y1="32" x2="156" y2="32"/>
    <!-- Vidro direito: direita, topo e base -->
    <line x1="260" y1="32" x2="260" y2="208"/>
    <line x1="156" y1="32" x2="260" y2="32"/>
    <line x1="156" y1="208" x2="260" y2="208"/>
  </g>

  <!-- Vidro: divisao interna, base esquerda e contornos de vidro -->
  <g stroke="#000" stroke-width="2.5" stroke-linecap="square">
    <line x1="156" y1="32" x2="156" y2="208"/>
    <line x1="48" y1="208" x2="156" y2="208"/>
  </g>

  <g color="#9AA0A6">
    <rect x="48" y="32" width="18" height="8" fill="currentColor"/>
    <rect x="48" y="200" width="18" height="8" fill="currentColor"/>
    <rect x="136" y="200" width="10" height="8" fill="currentColor"/>
    <use href="#fechadura" x="141" y="103" width="15" height="34"/>
  </g>
</svg>
