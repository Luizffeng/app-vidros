<svg xmlns="http://www.w3.org/2000/svg" width="216" height="176" viewBox="0 0 216 176" aria-labelledby="title">
  <title id="title">Vidro Incolor — padrao repetivel (gradiente leve)</title>
  <defs>
    <!-- Gradiente no fundo (por painel / area recortada) -->
    <linearGradient id="glass-incolor-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="216" y2="176">
      <stop offset="0%" stop-color="#C8EBFA"/>
      <stop offset="100%" stop-color="#A8D8F0"/>
    </linearGradient>

    <!-- Apenas faixas de reflexo — fundo transparente -->
    <pattern
      id="glass-incolor-stripes"
      patternUnits="userSpaceOnUse"
      width="84"
      height="56"
      patternTransform="rotate(32 42 28)"
    >
      <rect width="84" height="56" fill="none"/>
      <g fill="#F0FAFE">
        <rect x="7" y="-12" width="4" height="80"/>
        <rect x="18" y="-12" width="18" height="80"/>
      </g>
    </pattern>

    <!-- Pattern combinado para copiar em diagramas (gradiente + faixas no tile) -->
    <pattern
      id="glass-incolor-tile-gradient"
      patternUnits="userSpaceOnUse"
      width="84"
      height="56"
      patternTransform="rotate(32 42 28)"
    >
      <linearGradient id="glass-incolor-grad-tile" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#C8EBFA"/>
        <stop offset="100%" stop-color="#A8D8F0"/>
      </linearGradient>
      <rect width="84" height="56" fill="url(#glass-incolor-grad-tile)"/>
      <g fill="#F0FAFE">
        <rect x="7" y="-12" width="4" height="80"/>
        <rect x="18" y="-12" width="18" height="80"/>
      </g>
    </pattern>
  </defs>

  <!-- Preview visivel: gradiente + faixas em camadas -->
  <rect width="216" height="176" fill="url(#glass-incolor-grad)"/>
  <rect width="216" height="176" fill="url(#glass-incolor-stripes)"/>
</svg>
