<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" fill="none" aria-labelledby="title">
  <title id="title">Bascula (aluminio)</title>
  <defs>
    <pattern id="glass-incolor-stripes" patternUnits="userSpaceOnUse" width="84" height="56" patternTransform="rotate(32 42 28)">
      <rect width="84" height="56" fill="none"/>
      <g fill="#F0FAFE"><rect x="7" y="-12" width="4" height="80"/><rect x="18" y="-12" width="18" height="80"/></g>
    </pattern>
    <linearGradient id="glass-grad" gradientUnits="userSpaceOnUse" x1="70" y1="92" x2="250" y2="152">
      <stop offset="0%" stop-color="#C8EBFA"/><stop offset="100%" stop-color="#A8D8F0"/>
    </linearGradient>
    <clipPath id="vidro"><rect x="70" y="92" width="180" height="60"/></clipPath>
  </defs>
  <g clip-path="url(#vidro)">
    <rect x="70" y="92" width="180" height="60" fill="url(#glass-grad)"/>
    <rect x="70" y="92" width="180" height="60" fill="url(#glass-incolor-stripes)"/>
  </g>
  <g stroke="#9AA0A6" stroke-width="2.5" stroke-linecap="square">
    <line x1="70" y1="92" x2="70" y2="152"/><line x1="250" y1="92" x2="250" y2="152"/><line x1="70" y1="92" x2="250" y2="92"/>
  </g>
  <g stroke="#000" stroke-width="2.5" stroke-linecap="square">
    <line x1="70" y1="152" x2="250" y2="152"/>
  </g>
  <g color="#9AA0A6">
    <rect x="70" y="92" width="6" height="6" fill="currentColor"/>
    <rect x="70" y="119" width="6" height="6" fill="currentColor"/>
    <rect x="244" y="119" width="6" height="6" fill="currentColor"/>
  </g>
</svg>
